<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lock In</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        background: #111521;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        z-index: 9999;
        font-family: "Inter", system-ui, sans-serif;
      }
      #boot-splash .mark {
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: #6d5ef6;
      }
      #boot-splash .label {
        color: #edf1f8;
        font-size: 14px;
        letter-spacing: 0.05em;
      }
      @media (prefers-color-scheme: light) {
        #boot-splash {
          background: #fffdfb;
        }
        #boot-splash .label {
          color: #20242d;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot-splash">
      <div class="mark"></div>
      <p class="label">Lock In</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
